[package]
name = "inout-xor-repro"
version = "0.1.0"
edition = "2024"
license = "MIT-0"
publish = false

[dependencies]
aes = "0.9"
ctr = "0.10"

# What a size-sensitive binary ships with: fat LTO at "s".
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"

# The same at opt-level 3.
[profile.release-o3]
inherits = "release"
opt-level = 3

# Only the cipher crates and the caller raised to 3, as a size-sensitive binary would do for its
# hot path.
[profile.release-hot]
inherits = "release"

[profile.release-hot.package]
aes = { opt-level = 3 }
ctr = { opt-level = 3 }
cipher = { opt-level = 3 }
hybrid-array = { opt-level = 3 }
inout-xor-repro = { opt-level = 3 }
